<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.1/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      #ui-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      #start-button {
        padding: 15px 30px;
        font-size: 20px;
        font-family: sans-serif;
        font-weight: bold;
        color: white;
        background-color: #007bff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    
    <div id="ui-container">
      <button id="start-button">לחץ כדי להתחיל</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets/targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <!-- הוספנו muted כדי למנוע חסימות דפדפן, והשארנו preload="none" למניעת קריסת זיכרון -->
      <a-assets>
        <video id="vid1" src="./videos/video1.mp4" muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
        <video id="vid2" src="./videos/video2.mp4" muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
        <video id="vid3" src="./videos/video3.mp4" muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
        <video id="vid4" src="./videos/video4.mp4" muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
        <video id="vid5" src="./videos/video5.mp4" muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
        <video id="vid6" src="./videos/video6.mp4" muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" class="clickable-target">
        <a-video src="#vid1" width="1" height="0.55" position="0 0 0"></a-video>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1" class="clickable-target">
        <a-video src="#vid2" width="1" height="0.55" position="0 0 0"></a-video>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2" class="clickable-target">
        <a-video src="#vid3" width="1" height="0.55" position="0 0 0"></a-video>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 3" class="clickable-target">
        <a-video src="#vid4" width="1" height="0.55" position="0 0 0"></a-video>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 4" class="clickable-target">
        <a-video src="#vid5" width="1" height="0.55" position="0 0 0"></a-video>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 5" class="clickable-target">
        <a-video src="#vid6" width="1" height="0.55" position="0 0 0"></a-video>
      </a-entity>
      
    </a-scene>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const uiContainer = document.getElementById('ui-container');
        const startButton = document.getElementById('start-button');
        const targets = document.querySelectorAll('.clickable-target');
        const videos = document.querySelectorAll('video');

        // לחיצה על הכפתור רק מסתירה את המסך השחור - בלי להקריס את המצלמה
        startButton.addEventListener('click', function() {
          uiContainer.style.display = 'none';
        });

        // הפעלת הוידאו רק כשהתמונה מזוהה בפועל
        targets.forEach((target, index) => {
          const video = videos[index];
          
          target.addEventListener("targetFound", event => {
            console.log("Found target", index);
            let playPromise = video.play();
            if (playPromise !== undefined) {
              playPromise.catch(error => {
                console.warn("Playback prevented:", error);
              });
            }
          });
          
          target.addEventListener("targetLost", event => {
            console.log("Lost target", index);
            video.pause();
          });
        });
      });
    </script>
  </body>
</html>
