<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.1/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      #ui-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      #start-button {
        padding: 15px 30px;
        font-size: 20px;
        font-family: sans-serif;
        font-weight: bold;
        color: white;
        background-color: #007bff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 10px;
      }
      #version-number {
        color: rgba(255, 255, 255, 0.7);
        font-family: sans-serif;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    
    <div id="ui-container">
      <button id="start-button">לחץ כדי להתחיל</button>
      <div id="version-number">גרסה 2.4 (תיקון לאייפון)</div>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets/targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="vid1" src="./videos/mov01.mp4" muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
        <video id="vid2" src="./videos/mov02.mp4" muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
        <video id="vid3" src="./videos/mov03.mp4" muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
        <video id="vid4" src="./videos/mov04.mp4" muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
        <video id="vid5" src="./videos/mov05.mp4" muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
        <video id="vid6" src="./videos/mov06.mp4" muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
        <video id="vid7" src="./videos/mov07.mp4" muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
        <video id="vid8" src="./videos/mov08.mp4" muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
        <video id="vid9" src="./videos/mov09.mp4" muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
        <video id="vid10" src="./videos/mov10.mp4" muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
        <video id="vid11" src="./videos/mov11.mp4" muted loop crossorigin="anonymous" playsinline webkit-playsinline preload="none"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- תמונה 01 -> mov06 -->
      <a-entity mindar-image-target="targetIndex: 0" class="clickable-target">
        <a-entity class="spinner" geometry="primitive: ring; radiusInner: 0.15; radiusOuter: 0.25; thetaLength: 270" material="color: #ffffff; shader: flat" animation="property: rotation; to: 0 0 -360; loop: true; dur: 1000; easing: linear" position="0 0 0.01"></a-entity>
        <a-video src="#vid6" width="1" height="1.417" position="0 0 0" visible="false"></a-video>
      </a-entity>

        <a-video src="#vid7" width="1" height="1.417" position="0 0 0" visible="false"></a-video>

      </a-entity>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const uiContainer = document.getElementById('ui-container');
        const startButton = document.getElementById('start-button');
        const targets = document.querySelectorAll('.clickable-target');
        
        // משתנה ששומר את הוידאו שפעיל כרגע כדי שנוכל לכבות אותו כשעוברים תמונה
        let activeVideo = null;

        startButton.addEventListener('click', function() {
          uiContainer.style.display = 'none';
        });

        targets.forEach((target) => {
          const videoElement = target.querySelector('a-video');
          const spinnerElement = target.querySelector('.spinner');
          const videoId = videoElement.getAttribute('src').substring(1);
          const video = document.getElementById(videoId);
          
          video.addEventListener('playing', () => {
            spinnerElement.setAttribute('visible', 'false');
            videoElement.setAttribute('visible', 'true');
          });

          target.addEventListener("targetFound", event => {
            // כיבוי ואיפוס מוחלט של כל וידאו אחר שפעל כדי לשחרר זיכרון באייפון
            if (activeVideo && activeVideo !== video) {
              activeVideo.pause();
              activeVideo.currentTime = 0; // קריטי לאייפונים
            }
            activeVideo = video;

            spinnerElement.setAttribute('visible', 'true');
            videoElement.setAttribute('visible', 'false');
            
            let playPromise = video.play();
            if (playPromise !== undefined) {
              playPromise.catch(error => {
                console.warn("Playback prevented:", error);
              });
            }
          });
          
          target.addEventListener("targetLost", event => {
            video.pause();
            // איפוס הוידאו להתחלה כשהוא יוצא מהפריים משחרר את הנעילה של מנוע המדיה
            video.currentTime = 0; 
            
            spinnerElement.setAttribute('visible', 'true');
            videoElement.setAttribute('visible', 'false');
          });
        });
      });
    </script>
  </body>
</html>
